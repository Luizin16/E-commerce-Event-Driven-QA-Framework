name: CI/CD Kafka QA Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Executar suíte de testes (Maven + Testcontainers)
        run: mvn test

      - name: Instalar Allure CLI
        if: always()
        uses: allure-framework/setup-allure@v1
        with:
          allure-version: '2.29.0'

      - name: Gerar Relatório HTML do Allure
        if: always()
        run: allure generate allure-results --clean -o allure-report

      - name: Deploy Allure Report para GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
          publish_branch: gh-pages